name: Build ServerMMO plugins

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'server/plugins/*.jar'
      - 'server/scripts/rcon-test-reward.ps1'
      - 'server/scripts/rcon-test-reward/**'
      - '.github/workflows/build-plugins.yml'
  workflow_dispatch:
    inputs:
      mode:
        description: Choose a normal plugin deployment or the one-off RCON test reward.
        required: true
        type: choice
        options:
          - build-and-deploy
          - rcon-test-reward
        default: build-and-deploy

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'workflow_dispatch' || inputs.mode != 'rcon-test-reward'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: |
          set -o pipefail
          mvn -B -ntp -f plugins/pom.xml clean package 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f build.log
          git commit -m "ci: build log (failed run)" || true
          git push || true

      - name: Collect jars
        run: |
          mkdir -p dist
          cp plugins/servermmo-core/target/servermmo-core-*.jar dist/
          cp plugins/servermmo-mobs/target/servermmo-mobs-*.jar dist/
          cp plugins/servermmo-players/target/servermmo-players-*.jar dist/
          cp plugins/servermmo-hud/target/servermmo-hud-*.jar dist/
          cp server/resourcepack/servermmo-hud.zip dist/
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: servermmo-plugins
          path: dist/*
          if-no-files-found: error

      - name: Publish jars to server/plugins
        run: |
          mkdir -p server/plugins server/resourcepack
          cp dist/servermmo-*.jar server/plugins/
          cp dist/servermmo-hud.zip server/resourcepack/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f server/plugins/*.jar server/resourcepack/*.zip
          if git diff --cached --quiet; then
            echo "jar-файлы не изменились"
          else
            git commit -m "chore: rebuild ServerMMO plugins"
            git push
          fi

  deploy-windows:
    needs: build
    if: github.ref == 'refs/heads/arena/01a107fb-servermmo' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'rcon-test-reward')
    runs-on: [self-hosted, Windows, X64, servermmo]
    timeout-minutes: 10
    permissions:
      contents: read
    concurrency:
      group: servermmo-windows-deploy
      cancel-in-progress: false
    env:
      SERVER_ROOT: ${{ vars.SERVER_ROOT }}
      PAPER_SERVICE: ${{ vars.PAPER_SERVICE || 'ServerMMO' }}
    steps:
      - name: Checkout latest built files
        uses: actions/checkout@v4
        with:
          # The build job may have pushed the newly built JARs after this run's
          # original commit. Resolve the branch head after that job completes.
          ref: ${{ github.ref_name }}

      - name: Deploy plugins and resource pack, then start Paper
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:SERVER_ROOT)) {
            throw 'Set repository variable SERVER_ROOT to the persistent Windows server folder.'
          }
          if ([string]::IsNullOrWhiteSpace($env:PAPER_SERVICE)) {
            throw 'Set repository variable PAPER_SERVICE to the Windows Paper service name.'
          }
          & "$env:GITHUB_WORKSPACE\server\scripts\deploy-windows.ps1" `
            -ServerRoot $env:SERVER_ROOT `
            -ServiceName $env:PAPER_SERVICE `
            -SourceRoot $env:GITHUB_WORKSPACE

  rcon-test-reward:
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'rcon-test-reward' && github.ref == 'refs/heads/arena/01a107fb-servermmo'
    runs-on: [self-hosted, Windows, X64, servermmo]
    timeout-minutes: 2
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js for the tested RCON client
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.0'

      - name: Give test reward and place a safe platform
        shell: powershell
        env:
          RCON_PASSWORD: ${{ secrets.SERVER_RCON_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $source = "$env:GITHUB_WORKSPACE\server\scripts\rcon-test-reward"
          $helper = Join-Path $env:RUNNER_TEMP 'rcon-test-reward'
          New-Item -ItemType Directory -Force -Path $helper | Out-Null
          Copy-Item -Path @(
            (Join-Path $source 'package.json'),
            (Join-Path $source 'package-lock.json'),
            (Join-Path $source 'index.mjs')
          ) -Destination $helper -Force
          npm ci --prefix $helper --no-audit --no-fund
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node (Join-Path $helper 'index.mjs')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
