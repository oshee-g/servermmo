name: Build ServerMMO plugins

on:
  push:
    branches: ['**']
    paths-ignore:
      - 'server/plugins/*.jar'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Build with Maven
        run: mvn -B -ntp -f plugins/pom.xml clean package

      - name: Collect jars
        run: |
          mkdir -p dist
          cp plugins/servermmo-core/target/servermmo-core-*.jar dist/
          cp plugins/servermmo-mobs/target/servermmo-mobs-*.jar dist/
          cp plugins/servermmo-players/target/servermmo-players-*.jar dist/
          cp plugins/servermmo-hud/target/servermmo-hud-*.jar dist/
          cp server/resourcepack/servermmo-hud.zip dist/
          ls -la dist

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: servermmo-plugins
          path: dist/*
          if-no-files-found: error

      - name: Publish jars to server/plugins
        run: |
          mkdir -p server/plugins server/resourcepack
          cp dist/servermmo-*.jar server/plugins/
          cp dist/servermmo-hud.zip server/resourcepack/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f server/plugins/*.jar server/resourcepack/*.zip
          if git diff --cached --quiet; then
            echo "jar-файлы не изменились"
          else
            git commit -m "chore: rebuild ServerMMO plugins"
            git push
          fi
