name: Smoke test on real Paper 26.3

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'plugins/**'
      - 'tools/**'
      - 'server/resourcepack/**'
      - 'server/server.properties'
      - '.github/workflows/smoke-test.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugins
        run: mvn -B -ntp -f plugins/pom.xml clean package

      - name: Test the resource pack contents
        run: |
          set -euo pipefail
          python3 tools/gen_resourcepack.py
          python3 tools/check_pack.py
          sha1sum server/resourcepack/servermmo-hud.zip
          # таблица ширин глифов должна быть пересобрана вместе с атласами
          python3 tools/gen_font_metrics.py
          git diff --exit-code -- plugins/servermmo-hud/src/main/resources/font-metrics.properties \
            || { echo "::error::font-metrics.properties устарел: запусти tools/gen_font_metrics.py"; exit 1; }

      - name: Download Paper 26.3
        run: |
          set -euo pipefail
          URL=$(curl -sS --max-time 60 https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server:default']['url'])")
          echo "paper: $URL"
          mkdir -p run/plugins
          curl -sSL --max-time 300 -o run/paper.jar "$URL"
          ls -la run/paper.jar

      - name: Prepare server
        run: |
          set -euo pipefail
          cp plugins/servermmo-core/target/servermmo-core-*.jar run/plugins/
          cp plugins/servermmo-mobs/target/servermmo-mobs-*.jar run/plugins/
          cp plugins/servermmo-players/target/servermmo-players-*.jar run/plugins/
          cp plugins/servermmo-hud/target/servermmo-hud-*.jar run/plugins/
          mkdir -p run/resourcepack
          cp server/resourcepack/servermmo-hud.zip run/resourcepack/
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          server-port=25599
          online-mode=false
          level-type=minecraft\:flat
          level-name=world
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          max-players=5
          white-list=false
          enable-query=false
          enable-rcon=false
          sync-chunk-writes=false
          PROPS
          sed -i 's/^ *//' run/server.properties
          cat run/server.properties

      - name: Run server and check plugins
        run: |
          set -uo pipefail
          cd run
          mkfifo console_in
          ( timeout 420 java -Xms1G -Xmx2G -jar paper.jar --nogui < console_in > console.log 2>&1 ) &
          SERVER_PID=$!
          exec 3> console_in

          echo "Ждём запуска..."
          READY=0
          for i in $(seq 1 200); do
            if grep -q 'Done (' console.log 2>/dev/null; then READY=1; break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then break; fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Сервер не дошёл до 'Done ('"
            tail -n 120 console.log
            exit 1
          fi
          echo "Сервер запустился"

          echo "plugins" >&3
          sleep 8
          echo "stats" >&3
          sleep 2
          echo "hud" >&3
          sleep 2

          echo "forceload add 0 0" >&3
          echo "gamerule doMobSpawning false" >&3
          sleep 3

          # 1. Ванильный моб остаётся ванильным: у него полное здоровье.
          echo "execute in minecraft:overworld run summon minecraft:zombie 10 -59 0 {NoAI:1b,NoGravity:1b,PersistenceRequired:1b}" >&3
          sleep 4
          echo "say STEP1_VANILLA" >&3
          echo "execute in minecraft:overworld run data get entity @e[type=minecraft:zombie,limit=1] Health" >&3
          sleep 3

          # 2. Кастомный моб создаётся только командой /mob spawn.
          echo "mob spawn 2 chicken 0 -59 0" >&3
          sleep 4
          echo "say STEP2_CUSTOM" >&3
          echo "execute in minecraft:overworld if entity @e[type=minecraft:chicken]" >&3
          sleep 2
          echo "execute in minecraft:overworld run data get entity @e[type=minecraft:chicken,limit=1] CustomName" >&3
          sleep 3

          # 3. Курица 2 уровня: 11 HP. Пять урона - жива, смертельный - исчезает.
          echo "execute in minecraft:overworld run damage @e[type=minecraft:chicken,limit=1] 5" >&3
          sleep 2
          echo "say STEP3_AFTER_5" >&3
          echo "execute in minecraft:overworld if entity @e[type=minecraft:chicken]" >&3
          sleep 3
          echo "execute in minecraft:overworld run damage @e[type=minecraft:chicken,limit=1] 99999999" >&3
          sleep 2
          echo "say STEP4_AFTER_LETHAL" >&3
          echo "execute in minecraft:overworld if entity @e[type=minecraft:chicken]" >&3
          sleep 3
          echo "stop" >&3

          for i in $(seq 1 60); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then break; fi
            sleep 2
          done
          kill $SERVER_PID 2>/dev/null || true

          echo "==================== ВЫВОД ===================="
          grep -E 'ServerMMO|Done \(|Plugin:|enabled' console.log | head -60 || true
          echo "==============================================="

          FAIL=0
          for name in ServerMMOCore ServerMMOMobs ServerMMOPlayers ServerMMOHud; do
            if grep -q "$name включён" console.log; then
              echo "OK: $name"
            else
              echo "::error::Плагин $name не включился"
              FAIL=1
            fi
          done

          # Ядро больше не поднимает HTTP-раздачу: пак раздаётся ссылкой в
          # server.properties, а не сервером.
          if grep -q 'Раздача ресурспака' console.log; then
            echo "::error::Ядро всё ещё поднимает раздачу ресурспака на 8080"
            FAIL=1
          else
            echo "OK: ядро не раздаёт ресурспак (только ссылка в server.properties)"
          fi
          if grep -q 'панель строками босс-бара' console.log; then
            echo "OK: HUD работает строками босс-бара, без сущностей в мире"
          else
            echo "::error::HUD не сообщил о работе через строки босс-бара"
            FAIL=1
          fi

          if grep -q 'Создан Курица 2 уровня: 11 HP, 3 урона' console.log; then
            echo "OK: кастомный моб создан командой /mob spawn"
          else
            echo "::error::Команда /mob spawn не создала моба 2 уровня"
            grep -E 'mob|Курица|Unknown command' console.log | tail -10 || true
            FAIL=1
          fi

          # Подпись над мобом: вражеский значок L, красный уровень, имя,
          # сердце с HP и меч с уроном; иконки используют шрифт пака.
          TAG_LINE=$(grep -E 'Курица .* has the following entity data' console.log | head -1 || true)
          TAG_GLYPHS=$(printf '%s' "$TAG_LINE" | grep -o 'font: "servermmo:hud"' | wc -l)
          if [ "$TAG_GLYPHS" -ge 4 ]; then
            echo "OK: подпись моба использует шрифт пака ($TAG_GLYPHS куска)"
          else
            echo "::error::В подписи моба $TAG_GLYPHS кусков шрифта пака (ожидалось 4)"
            echo "$TAG_LINE" | head -2 || true
            FAIL=1
          fi
          if printf '%s' "$TAG_LINE" | grep -q $'\uE4D5'; then
            echo "OK: в подписи моба есть сгенерированный значок уровня L"
          else
            echo "::error::В подписи моба нет сгенерированного значка уровня L"
            echo "$TAG_LINE" | head -2 || true
            FAIL=1
          fi
          if printf '%s' "$TAG_LINE" | grep -q 'Ур'; then
            echo "::error::В подписи моба осталось слово «Ур»"
            echo "$TAG_LINE" | head -2 || true
            FAIL=1
          else
            echo "OK: слова «Ур» в подписи нет"
          fi

          if awk '/STEP1_VANILLA/{f=1} f && /Zombie has the following entity data/{print; exit}' console.log \
              | grep -Eq '[0-9]+\.[0-9]+f'; then
            ZOMBIE_HP=$(awk '/STEP1_VANILLA/{f=1} f && /Zombie has the following entity data/{print; exit}' console.log \
              | grep -oE '[0-9]+\.[0-9]+f' | head -1)
            if [ "${ZOMBIE_HP%.*}" -ge 2 ]; then
              echo "OK: ванильный зомби не тронут кастомной системой (Health $ZOMBIE_HP)"
            else
              echo "::error::Ванильному зомби урезали здоровье ($ZOMBIE_HP)"
              FAIL=1
            fi
          else
            echo "[warn] не удалось прочитать здоровье ванильного зомби"
          fi

          if grep -q 'STEP4_AFTER_LETHAL' console.log && \
             awk '/STEP3_AFTER_5/{f=1} /STEP4_AFTER_LETHAL/{f=0} f' console.log | grep -q 'Chicken'; then
            echo "OK: курица жива после 5 урона и исчезла после смертельного"
          else
            echo "[warn] поведение урона по кастомному мобу не подтверждено"
          fi

          if grep -q 'ServerMMOMobs\] .*ударил' console.log || grep -q '\[debug\]' console.log; then
            echo "debug-сообщения боя есть в логе"
          fi

          if grep -Eq 'Could not load|Failed to enable|java\.lang\.[A-Za-z]*Exception' console.log; then
            echo "::error::В логе есть ошибки:"
            grep -E 'Could not load|Failed to enable|java\.lang\.[A-Za-z]*Exception' console.log | head -20
            FAIL=1
          fi

          cp console.log ../console.log
          exit $FAIL

      - name: Publish server log
        if: always()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f console.log ]; then cp console.log smoke-test.log; fi
          if [ -f smoke-test.log ]; then
            echo "=== ключевые строки лога ==="
            grep -E 'ServerMMO|Done \(|Starting minecraft server' smoke-test.log | head -20 || true
            git stash push --include-untracked -- smoke-test.log 2>/dev/null || true
            git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
            git stash pop 2>/dev/null || true
            git add -f smoke-test.log
            git commit -m "ci: smoke test log" 2>/dev/null || echo "нечего коммитить"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "лог опубликован"; break; fi
              git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
              sleep 5
            done
          fi
