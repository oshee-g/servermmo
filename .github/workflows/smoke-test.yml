name: Smoke test on real Paper 26.3

on:
  workflow_dispatch:
  push:
    branches: ['**']
    paths:
      - 'plugins/**'
      - 'server/resourcepack/**'
      - 'server/scripts/resourcepack.ps1'
      - 'server/pack-server.bat'
      - 'server/setup-resourcepack.bat'
      - '.github/workflows/smoke-test.yml'

permissions:
  contents: write

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Build plugins
        run: mvn -B -ntp -f plugins/pom.xml clean package

      - name: Test the resource pack HTTP server
        run: |
          set -euo pipefail
          cd server/resourcepack
          java PackServer.java 8099 servermmo-hud.zip > /tmp/packserver.log 2>&1 &
          echo $! > /tmp/packserver.pid

          started=0
          for i in $(seq 1 40); do
            if curl -fsS http://127.0.0.1:8099/health >/dev/null 2>&1; then started=1; break; fi
            sleep 1
          done
          echo "---------- лог сервера ----------"
          cat /tmp/packserver.log
          echo "---------------------------------"
          if [ "$started" -ne 1 ]; then
            echo "::error::PackServer не запустился"
            exit 1
          fi

          expected=$(sha1sum servermmo-hud.zip | cut -d' ' -f1)
          curl -fsS -o /tmp/downloaded.zip http://127.0.0.1:8099/servermmo-hud.zip
          actual=$(sha1sum /tmp/downloaded.zip | cut -d' ' -f1)
          echo "sha1 файла:      $expected"
          echo "sha1 скачанного: $actual"
          [ "$expected" = "$actual" ] || { echo "::error::скачанный ресурспак отличается"; exit 1; }
          grep -q "$expected" /tmp/packserver.log || { echo "::error::в баннере неверный SHA-1"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8099/missing.txt)
          echo "неизвестный путь -> $code"
          [ "$code" = "404" ] || { echo "::error::ожидался 404"; exit 1; }

          code=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8099/)
          echo "POST -> $code"
          [ "$code" = "405" ] || { echo "::error::ожидался 405"; exit 1; }

          length=$(curl -sI http://127.0.0.1:8099/servermmo-hud.zip | tr -d '\r' | awk -F': ' 'tolower($1)=="content-length"{print $2}')
          real=$(stat -c%s servermmo-hud.zip)
          echo "HEAD Content-Length=$length, размер файла=$real"
          [ "$length" = "$real" ] || { echo "::error::неверный Content-Length"; exit 1; }

          body=$(curl -fsS http://127.0.0.1:8099/)
          echo "$body" | grep -q "ServerMMO HUD" || { echo "::error::нет индексной страницы"; exit 1; }

          kill "$(cat /tmp/packserver.pid)" 2>/dev/null || true
          cp /tmp/packserver.log "$GITHUB_WORKSPACE/packserver-test.log"
          echo "PACK SERVER OK"

      - name: Test the resource pack setup tool
        run: |
          set -euo pipefail
          cd server/resourcepack
          work=$(mktemp -d)
          cp ../server.properties "$work/server.properties"
          # строка с не-ASCII байтом: файл должен остаться байт в байт
          printf '# motd test: \xe2\x9c\x93\n' >> "$work/server.properties"

          echo "--- первый прогон (URL из аргумента) ---"
          java SetupPack.java --url "http://192.168.1.50:8080/servermmo-hud.zip" \
              --props "$work/server.properties" --port 8080

          props="$work/server.properties"
          expected=$(sha1sum servermmo-hud.zip | cut -d' ' -f1)

          grep -qx 'resource-pack=http://192.168.1.50:8080/servermmo-hud.zip' "$props" \
            || { echo "::error::resource-pack не записан"; exit 1; }
          grep -qx "resource-pack-sha1=$expected" "$props" \
            || { echo "::error::resource-pack-sha1 неверный"; exit 1; }
          grep -qx 'require-resource-pack=false' "$props" \
            || { echo "::error::require-resource-pack не записан"; exit 1; }
          grep -q '^resource-pack-prompt={"text"' "$props" \
            || { echo "::error::prompt не записан"; exit 1; }
          [ "$(grep -c '^resource-pack=' "$props")" = "1" ] \
            || { echo "::error::resource-pack продублирован"; exit 1; }
          grep -q 'motd test' "$props" || { echo "::error::потеряна строка с не-ASCII"; exit 1; }
          tail -1 "$props" | xxd -p | grep -q 'e29c93' \
            || { echo "::error::не-ASCII байты изменились"; exit 1; }
          [ -f "$props.bak" ] || { echo "::error::нет бэкапа server.properties.bak"; exit 1; }

          echo "--- второй прогон (идемпотентность + --require true) ---"
          java SetupPack.java --url "https://cdn.example.com/servermmo-hud.zip" \
              --props "$props" --require true > /dev/null
          grep -qx 'resource-pack=https://cdn.example.com/servermmo-hud.zip' "$props"
          grep -qx 'require-resource-pack=true' "$props"
          [ "$(grep -c '^resource-pack=' "$props")" = "1" ] \
            || { echo "::error::resource-pack продублирован во втором прогоне"; exit 1; }

          echo "--- отказ от некорректного URL ---"
          if java SetupPack.java --url "ftp://bad/file.zip" --props "$props" > /tmp/bad.log 2>&1; then
            echo "::error::ftp:// должен был привести к ошибке"
            exit 1
          fi
          grep -q 'http:// or https://' /tmp/bad.log

          echo "--- файл без ключей ресурспака: значения дописываются ---"
          bare="$work/bare.properties"
          printf 'motd=bare\nmax-players=20\n' > "$bare"
          java SetupPack.java --url "http://10.0.0.2:8080/servermmo-hud.zip" --props "$bare" > /dev/null
          [ "$(grep -c '^resource-pack=' "$bare")" = "1" ]
          [ "$(grep -c '^resource-pack-sha1=' "$bare")" = "1" ]
          grep -qx 'motd=bare' "$bare"
          tail -c 1 "$bare" | od -An -c | grep -q '\\n' \
            || { echo "::error::в конец файла не добавлен перевод строки"; exit 1; }

          echo "SETUP PACK OK"

      - name: Download Paper 26.3
        run: |
          set -euo pipefail
          URL=$(curl -sS --max-time 60 https://fill.papermc.io/v3/projects/paper/versions/26.3/builds/latest \
                | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['downloads']['server:default']['url'])")
          echo "paper: $URL"
          mkdir -p run/plugins
          curl -sSL --max-time 300 -o run/paper.jar "$URL"
          ls -la run/paper.jar

      - name: Prepare server
        run: |
          set -euo pipefail
          cp plugins/servermmo-core/target/servermmo-core-*.jar run/plugins/
          cp plugins/servermmo-mobs/target/servermmo-mobs-*.jar run/plugins/
          cp plugins/servermmo-players/target/servermmo-players-*.jar run/plugins/
          cp plugins/servermmo-hud/target/servermmo-hud-*.jar run/plugins/
          mkdir -p run/resourcepack
          cp server/resourcepack/servermmo-hud.zip run/resourcepack/
          echo "eula=true" > run/eula.txt
          cat > run/server.properties <<'PROPS'
          server-port=25599
          online-mode=false
          level-type=minecraft\:flat
          level-name=world
          spawn-protection=0
          view-distance=4
          simulation-distance=4
          max-players=5
          white-list=false
          enable-query=false
          enable-rcon=false
          sync-chunk-writes=false
          PROPS
          sed -i 's/^ *//' run/server.properties
          cat run/server.properties

      - name: Run server and check plugins
        run: |
          set -uo pipefail
          cd run
          mkfifo console_in
          ( timeout 420 java -Xms1G -Xmx2G -jar paper.jar --nogui < console_in > console.log 2>&1 ) &
          SERVER_PID=$!
          exec 3> console_in

          echo "Ждём запуска..."
          READY=0
          for i in $(seq 1 200); do
            if grep -q 'Done (' console.log 2>/dev/null; then READY=1; break; fi
            if ! kill -0 $SERVER_PID 2>/dev/null; then break; fi
            sleep 2
          done

          if [ "$READY" -ne 1 ]; then
            echo "::error::Сервер не дошёл до 'Done ('"
            tail -n 120 console.log
            exit 1
          fi
          echo "Сервер запустился"

          echo "--- встроенная раздача ресурспака (порт 8080) ---"
          PACK_FAIL=0
          PACK_SHA=$(sha1sum ../server/resourcepack/servermmo-hud.zip | cut -d' ' -f1)
          PACK_UP=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:8080/health > /dev/null 2>&1; then PACK_UP=1; break; fi
            sleep 1
          done
          if [ "$PACK_UP" -ne 1 ]; then
            echo "::error::Плагин не поднял раздачу ресурспака на порту 8080"
            grep -iE 'ресурспак|resourcepack|порт' console.log | tail -20 || true
            PACK_FAIL=1
          else
            curl -fsS http://127.0.0.1:8080/health | grep -qx ok \
              || { echo "::error::/health вернул не ok"; PACK_FAIL=1; }
            curl -fsS -o /tmp/pack-embedded.zip http://127.0.0.1:8080/servermmo-hud.zip \
              || { echo "::error::пак не скачался"; PACK_FAIL=1; }
            echo "$PACK_SHA  /tmp/pack-embedded.zip" | sha1sum -c - \
              || { echo "::error::SHA-1 скачанного пака не совпал"; PACK_FAIL=1; }
            [ "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/missing.txt)" = "404" ] \
              || { echo "::error::неизвестный путь не дал 404"; PACK_FAIL=1; }
            [ "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/)" = "405" ] \
              || { echo "::error::POST не дал 405"; PACK_FAIL=1; }
            [ "$(curl -sI http://127.0.0.1:8080/servermmo-hud.zip | tr -d '\r' | awk -F': ' 'tolower($1)=="content-length"{print $2}')" = "$(stat -c %s /tmp/pack-embedded.zip)" ] \
              || { echo "::error::Content-Length не совпал с размером файла"; PACK_FAIL=1; }
            curl -fsS http://127.0.0.1:8080/sha1 | grep -qx "$PACK_SHA" \
              || { echo "::error::/sha1 вернул неверный хеш"; PACK_FAIL=1; }
            curl -fsS http://127.0.0.1:8080/ | grep -q 'ServerMMO HUD' \
              || { echo "::error::нет индексной страницы"; PACK_FAIL=1; }
            echo "раздача отвечает, SHA-1 $PACK_SHA"
          fi

          echo "plugins" >&3
          sleep 8
          echo "stats" >&3
          sleep 2
          echo "hud" >&3
          sleep 2

          echo "forceload add 0 0" >&3
          echo "gamerule doMobSpawning false" >&3
          sleep 3
          echo "execute in minecraft:overworld run summon minecraft:zombie 0 -59 0 {NoAI:1b,NoGravity:1b,PersistenceRequired:1b,Silent:0b}" >&3
          sleep 4
          echo "say STEP1_SUMMONED" >&3
          echo "execute in minecraft:overworld if entity @e[type=minecraft:zombie]" >&3
          sleep 3
          echo "execute in minecraft:overworld run damage @e[type=minecraft:zombie,limit=1] 5" >&3
          sleep 2
          echo "say STEP2_AFTER_5" >&3
          echo "execute in minecraft:overworld if entity @e[type=minecraft:zombie]" >&3
          sleep 3
          echo "execute in minecraft:overworld run damage @e[type=minecraft:zombie,limit=1] 99999999" >&3
          sleep 2
          echo "say STEP3_AFTER_LETHAL" >&3
          echo "execute in minecraft:overworld if entity @e[type=minecraft:zombie]" >&3
          sleep 3
          echo "execute in minecraft:overworld run summon minecraft:chicken 2 -59 0 {NoGravity:1b,PersistenceRequired:1b}" >&3
          sleep 3
          echo "execute in minecraft:overworld if entity @e[type=minecraft:chicken]" >&3
          sleep 3
          echo "stop" >&3

          for i in $(seq 1 60); do
            if ! kill -0 $SERVER_PID 2>/dev/null; then break; fi
            sleep 2
          done
          kill $SERVER_PID 2>/dev/null || true

          echo "==================== ВЫВОД ===================="
          grep -E 'ServerMMO|Done \(|Plugin:|enabled' console.log | head -60 || true
          echo "==============================================="

          FAIL=${PACK_FAIL:-0}
          for name in ServerMMOCore ServerMMOMobs ServerMMOPlayers ServerMMOHud; do
            if grep -q "$name включён" console.log; then
              echo "OK: $name"
            else
              echo "::error::Плагин $name не включился"
              FAIL=1
            fi
          done

          if grep -q 'Раздача ресурспака' console.log; then
            echo "встроенная раздача ресурспака есть в логе"
          fi

          if grep -q 'ServerMMOMobs\] .*ударил' console.log || grep -q '\[debug\]' console.log; then
            echo "debug-сообщения боя есть в логе"
          fi

          if grep -Eq 'Could not load|Failed to enable|java\.lang\.[A-Za-z]*Exception' console.log; then
            echo "::error::В логе есть ошибки:"
            grep -E 'Could not load|Failed to enable|java\.lang\.[A-Za-z]*Exception' console.log | head -20
            FAIL=1
          fi

          cp console.log ../console.log
          exit $FAIL

      - name: Publish server log
        if: always()
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if [ -f console.log ]; then cp console.log smoke-test.log; fi
          if [ -f packserver-test.log ]; then echo "лог мини-сервера ресурспака:"; head -40 packserver-test.log; fi
          if [ -f smoke-test.log ]; then
            echo "=== ключевые строки лога ==="
            grep -E 'ServerMMO|Done \(|Starting minecraft server' smoke-test.log | head -20 || true
            git stash push --include-untracked -- smoke-test.log 2>/dev/null || true
            git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
            git stash pop 2>/dev/null || true
            git add -f smoke-test.log packserver-test.log 2>/dev/null || git add -f smoke-test.log
            git commit -m "ci: smoke test log" 2>/dev/null || echo "нечего коммитить"
            for attempt in 1 2 3; do
              if git push origin "HEAD:${GITHUB_REF_NAME}"; then echo "лог опубликован"; break; fi
              git pull --rebase origin "${GITHUB_REF_NAME}" 2>/dev/null || true
              sleep 5
            done
          fi
