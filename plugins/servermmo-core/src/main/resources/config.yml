# ==========================================================================
# ServerMMOCore - настройки кастомной боевой системы
# ==========================================================================

# Подробные сообщения в консоль (для отладки урона и уровней)
debug: false

combat:
  # Во сколько кастомных единиц превращается 1.0 ванильного урона
  # (падение, лава, кактус, взрывы, голод).
  # 1.0 = один к одному: падение с 3 блоков (1.0 ванильного) снимает 1 HP.
  environment-damage-scale: 1.0

  # Обнулять ванильные атрибуты MAX_HEALTH, ATTACK_DAMAGE, ARMOR.
  # Держите true: иначе ванильное здоровье будет конфликтовать с кастомным.
  strip-vanilla-stats: true

  # Проигрывать звук смерти моба (сама анимация смерти отключена всегда).
  mob-death-sound: true

  # Ванильная анимация смерти мобов. false = моб просто исчезает.
  mob-death-animation: false

  # Покраснение сущности при получении урона (как в ванили).
  hurt-animation: true

storage:
  # Как часто сохранять профили игроков на диск, в секундах.
  save-interval-seconds: 300

# --------------------------------------------------------------------------
# Раздача ресурспака HUD
# --------------------------------------------------------------------------
# Пак раздаёт сам сервер: отдельное окно pack-server.bat не нужно.
# Ссылка и SHA-1 всё равно должны быть в server.properties — их записывает
# setup-resourcepack.bat. При старте плагин сверяет их с файлом и ругается,
# если они разошлись.
resourcepack:
  # false — не открывать HTTP-порт вообще.
  serve: true

  # Порт раздачи. Для игры через интернет его нужно пробросить на роутере.
  port: 8080

  # Файл пака относительно папки сервера.
  file: resourcepack/servermmo-hud.zip

  # 0.0.0.0 — слушать все интерфейсы (нужно игрокам из локальной сети).
  bind: 0.0.0.0

  # Внешний адрес пака, если сервер за NAT, прокси или туннелем
  # (например https://pack.example.com/servermmo-hud.zip).
  # Пусто — плагин подсказывает адрес вида http://<lan-ip>:8080/servermmo-hud.zip.
  public-url: ""
