# ==========================================================================
# ServerMMOHud - панель в левом верхнем углу
# ==========================================================================
# Панель рисует клиент: четыре строки босс-бара (панель класса с ником,
# уровень с опытом, клан, валюты), а в них — значки, цифры и буквы из шрифта
# ресурспака servermmo:hud (resourcepack/servermmo-hud.zip).
# Плагин только подставляет числа, поэтому панель не привязана к камере и не
# висит сущностью в мире.
#
# Ресурспак раздаёт сам сервер: один файл на Google Диске, а в
# server.properties — прямая ссылка (resource-pack), SHA-1 и
# require-resource-pack=true, чтобы попасть на сервер можно было только с
# паком. Плагин про ресурспак ничего не знает и за его загрузкой не следит.
#
# Здоровье живёт не наверху, а в хотбаре: строка экшн-бара «[сердце] 75»
# стоит у левого края хотбара, где были ванильные сердца (сами сердца
# спрятаны паком). Справа от неё при получении урона вспыхивает «−25[сердце]»:
# висит damage-hold-seconds в полной яркости, затем за damage-fade-seconds
# ступенями затухает и пропадает. Новый урон вспыхивает индикатор заново.
#
# Панель стоит не «в пикселях от края», а сдвигом от центра экрана: строку
# босс-бара клиент центрирует сам. Значит, чтобы панель попала в левый верхний
# угол, надо знать ширину интерфейса — а она равна ширине окна, поделённой на
# масштаб интерфейса (Настройки → Видео → Масштаб интерфейса). Ни того, ни
# другого клиент серверу не сообщает, поэтому оба значения вводит игрок:
#   /hud scale 2           масштаб интерфейса (0 или auto — «Авто»)
#   /hud screen 1920 1080  разрешение окна игры
#   /hud margin 8          отступ панели от левого края экрана
#   /hud offsetx -770      ручная подгонка: пересчитает margin по масштабу
#   /hud textx 12          сдвиг текста, цифр и малых значков вправо
#   /hud anchorx -91       левый край строки хотбара
#   /hud debug             расчёт отступов по всем масштабам
#   /hud reset             заводские значения
#
# Главное: сам сдвиг панели в конфиг не пишется. Он в пикселях интерфейса, и
# при смене масштаба меняется в разы: подобранный под масштаб 4 сдвиг -384 на
# масштабе 2 утащит панель за левый край экрана. Хранится отступ от края
# (margin-left) — он от масштаба не зависит, а сдвиг считается под текущий
# масштаб. Сменили масштаб — сказали /hud scale 3 — панель осталась в углу.

hud:
  # Разрешение окна игры в реальных пикселях (не интерфейса!). По нему и по
  # масштабу считается ширина интерфейса: 1920 / масштаб.
  screen-width: 1920
  screen-height: 1080

  # Масштаб интерфейса из настроек игры: Настройки → Видео → Масштаб
  # интерфейса. 0 (или auto) — «Авто»: считается по правилу клиента, для
  # 1920x1080 это 4. Игрок переопределяет его своей командой /hud scale <n>.
  gui-scale: 0

  # Отступ левого края панели от левого края экрана, в пикселях интерфейса.
  # Единственная величина, которая не зависит от масштаба: панель стоит в
  # углу одинаково при любом масштабе интерфейса. Отрицательная — панель
  # заходит за левый край (так иногда подрезают рамку панели).
  margin-left: 8

  # Горизонтальный сдвиг текста панели, цифр и малых значков относительно
  # эмблемы класса: -100..100 px, положительное значение — вправо.
  text-offset-x: 0

  # Сколько квадратов способностей рисовать справа от хотбара (0..8).
  # Логики за ними нет - это картинки, слоты просто заполняются подряд.
  # Восемь слотов по 32 px справа от хотбара не влезут, поэтому 4.
  ability-slots: 4

  # Левый край строки хотбара относительно центра экрана, в пикселях.
  # Хотбар шириной 182 px, его левый край — это -91: там стояли ванильные
  # сердца. Отрицательнее — левее, положительнее — правее. От масштаба
  # интерфейса не зависит: хотбар всегда по центру и всегда одной ширины.
  hotbar-anchor-x: -91

  # Сколько секунд индикатор урона «−25[сердце]» висит в полной яркости.
  damage-hold-seconds: 5

  # За сколько секунд индикатор потом затухает и исчезает.
  damage-fade-seconds: 2

  # Как часто обновлять цифры, в тиках. 2 — двадцать раз в секунду не нужно.
  update-interval-ticks: 2
