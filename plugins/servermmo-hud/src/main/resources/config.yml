# ==========================================================================
# ServerMMOHud - панель в левом верхнем углу
# ==========================================================================
# Панель рисует клиент: две строки босс-бара, а в них — значки, цифры и буквы
# из шрифта ресурспака servermmo:hud (resourcepack/servermmo-hud.zip).
# Плагин только подставляет числа, поэтому панель не привязана к камере и не
# висит сущностью в мире.
#
# Ресурспак лежит одним файлом на Google Диске; в server.properties
# прописаны прямая ссылка на него (resource-pack) и его SHA-1. Пока клиент не загрузит
# пак, HUD полностью скрыт: плагин слушает статус пака и не показывает ни
# строки босс-бара, ни строку хотбара (без пака это были бы белые полосы и
# пустые квадратики вместо значков).
#
# Здоровье живёт не наверху, а в хотбаре: строка экшн-бара «[сердце] 75»
# стоит у левого края хотбара, где были ванильные сердца (сами сердца
# спрятаны паком). Справа от неё при получении урона вспыхивает «−25[сердце]»:
# висит damage-hold-seconds в полной яркости, затем за damage-fade-seconds
# ступенями затухает и пропадает. Новый урон вспыхивает индикатор заново.
#
# Панель стоит не «в пикселях от края», а сдвигом от центра экрана: строку
# босс-бара клиент центрирует, и сервер не знает ширину интерфейса игрока.
# Размер панели задаёт сам клиент (масштаб интерфейса в настройках игры),
# поэтому подстраивается только сдвиг:
#   /hud offsetx -384
#   /hud reset
# Если панель уехала за левый край — увеличьте минус; если стоит слишком
# близко к центру — уменьшите.

hud:
  # Сдвиг панели в пикселях интерфейса. Отрицательный — влево.
  # -384 = отступ ~8 px от левого края при GUI scale 4 на 1920x1080
  # (ширина интерфейса 480 px, панель ~80 px).
  # При GUI scale 3 (ширина 640 px) ставьте около -544, при scale 5 — около -288.
  offset-x: -384

  # Левый край строки хотбара относительно центра экрана, в пикселях.
  # Хотбар шириной 182 px, его левый край — это -91: там стояли ванильные
  # сердца. Отрицательнее — левее, положительнее — правее.
  hotbar-anchor-x: -91

  # Сколько секунд индикатор урона «−25[сердце]» висит в полной яркости.
  damage-hold-seconds: 5

  # За сколько секунд индикатор потом затухает и исчезает.
  damage-fade-seconds: 2

  # Как часто обновлять цифры, в тиках. 2 — двадцать раз в секунду не нужно.
  update-interval-ticks: 2
