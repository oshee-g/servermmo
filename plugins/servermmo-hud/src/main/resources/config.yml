# ==========================================================================
# ServerMMOHud - панель в левом верхнем углу
# ==========================================================================
# Панель рисует клиент: две строки босс-бара, а в них — значки, цифры и буквы
# из шрифта ресурспака servermmo:hud (resourcepack/servermmo-hud.zip).
# Плагин только подставляет числа, поэтому панель не привязана к камере и не
# висит сущностью в мире.
#
# Ресурспак раздаётся через server.properties (resource-pack + -sha1);
# ссылку туда пишет server/setup-resourcepack.bat. Без пака вместо значков
# будут пустые квадратики, числа останутся читаемыми.
#
# Панель стоит не «в пикселях от края», а сдвигом от центра экрана: строку
# босс-бара клиент центрирует, и сервер не знает ширину интерфейса игрока.
# Размер панели задаёт сам клиент (масштаб интерфейса в настройках игры),
# поэтому подстраивается только сдвиг:
#   /hud offsetx -384
#   /hud reset
# Если панель уехала за левый край — увеличьте минус; если стоит слишком
# близко к центру — уменьшите.

hud:
  # Сдвиг панели в пикселях интерфейса. Отрицательный — влево.
  # -384 = отступ ~8 px от левого края при GUI scale 4 на 1920x1080
  # (ширина интерфейса 480 px, панель ~80 px).
  # При GUI scale 3 (ширина 640 px) ставьте около -544, при scale 5 — около -288.
  offset-x: -384

  # Как часто обновлять цифры, в тиках. 2 — двадцать раз в секунду не нужно.
  update-interval-ticks: 2
