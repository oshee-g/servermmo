# ==========================================================================
# ServerMMOHud - положение и размер рамки HUD
# ==========================================================================
# Иконки и цифры нарисованы ресурспаком resourcepack/ (он же
# server/resourcepack/servermmo-hud.zip). Без ресурспака вместо иконок
# будут видны пустые квадратики, а числа останутся ванильным шрифтом.
#
# Подбирать на месте удобнее командой:
#   /hud scale 0.04
#   /hud distance 1.0
#   /hud offsetx -0.55
#   /hud offsety 0.28

hud:
  # Расстояние от глаз до плоскости HUD, в блоках.
  distance: 1.0

  # Смещение вправо (+) / влево (-) относительно взгляда, в блоках.
  offset-x: -0.55

  # Смещение вверх (+) / вниз (-), в блоках.
  offset-y: 0.28

  # Масштаб рамки. Больше = крупнее.
  scale: 0.04

  # Как часто обновлять цифры, в тиках.
  update-interval-ticks: 2

  # Рисовать HUD поверх блоков.
  see-through: true

# Автоматическая раздача ресурспака клиентам.
# Без него ванильные сердца останутся видны.
resource-pack:
  enabled: false
  # Прямая ссылка на servermmo-hud.zip (например, на ваш веб-хостинг).
  url: "https://example.com/servermmo-hud.zip"
