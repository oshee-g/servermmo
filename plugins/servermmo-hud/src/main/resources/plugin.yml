name: ServerMMOHud
version: '1.0.0'
main: ru.servermmo.hud.ServerMMOHud
api-version: '26.3'
description: Панель HUD в левом верхнем углу - здоровье, урон, уровень, опыт
author: ServerMMO
website: https://github.com/oshee-g/servermmo
depend: [ServerMMOCore]
commands:
  hud:
    description: Сдвиг панели HUD
    usage: /hud offsetx <пиксели> | /hud reset
    permission: servermmo.hud
permissions:
  servermmo.hud:
    description: Настройка HUD
    default: op
