# ==========================================================================
# ServerMMOMobs - кастомные мобы
# ==========================================================================
# Обычные мобы в мире остаются ванильными. Кастомные (уровень, здоровье и
# урон из таблицы, агро 20 блоков, подпись «LVL 1 Курица 20»)
# создаются командой:
#   /mob spawn <уровень> <тип> [x y z]
#   /mob spawn 2 Курица
#   /mob spawn 40 zombie 100 65 -20

aggression:
  # Радиус, в котором моб замечает игрока (в блоках).
  radius: 20.0

  # Поворачивать голову и тело в сторону игрока.
  look-at-target: true

  # Мирные и нейтральные мобы тоже атакуют (курица, корова, лосось...).
  peaceful-mobs-attack: true

  # Пауза между ударами одного моба, в тиках (20 тиков = 1 секунда).
  attack-cooldown-ticks: 20

  # С какого расстояния моб может ударить, в блоках.
  attack-reach: 2.6

  # Скорость преследования для мирных мобов.
  follow-speed: 1.0

  # Как часто проверять обстановку, в тиках. 10 тиков = 2 раза в секунду.
  check-interval-ticks: 10

# Подпись над кастомным мобом.
tag:
  # Как часто обновлять цифры здоровья, в тиках.
  update-interval-ticks: 10

# Точки автоматического спавна кастомных мобов.
# Пока список пуст — в мире только ванильные мобы.
# Формат записи (координаты — блоки, как в игре по F3):
#
# spawns:
#   - world: world
#     type: Курица
#     level: 2
#     x: 100
#     y: 65
#     z: -20
#
# type можно писать по-русски (как в таблице) или по имени игры (chicken).
# Мобы создаются при старте сервера; после гибели сами не возвращаются.
spawns: []
