#Minecraft server properties (Paper 26.3)
#Full list of options: https://minecraft.wiki/w/Server.properties
#Lines starting with # are comments and the server keeps them.
#Restart the server after changing anything here.

#--- Access -------------------------------------------------------------
#26.3 enables the whitelist by default. It is disabled here on purpose so
#that friends can join right away. Set true for an invited-players-only server.
white-list=false
enforce-whitelist=false
online-mode=true
#Turn this off together with online-mode=false, otherwise clients without a
#Mojang account (cracked/TLauncher) may fail with "invalid session".
enforce-secure-profile=true
max-players=20
op-permission-level=4
function-permission-level=2
allow-flight=false
pvp=true
player-idle-timeout=0

#--- Network ------------------------------------------------------------
server-ip=
server-port=25565
enable-status=true
motd=Paper 26.3 server | welcome
network-compression-threshold=256
prevent-proxy-connections=false
use-native-transport=true
accepts-transfers=false
log-ips=true
enable-query=false
query.port=25565
enable-rcon=false
rcon.port=25575
rcon.password=
rate-limit=0
#Paper 26.3 can expose a management (JSON-RPC) endpoint on port 9900.
#It is switched off here; only turn it on if you really need remote control.
management-server-enabled=false
management-server-host=localhost
management-server-port=0

#--- World --------------------------------------------------------------
level-name=world
level-seed=
level-type=minecraft\:normal
generator-settings={}
generate-structures=true
max-world-size=29999984
spawn-protection=16
max-chained-neighbor-updates=1000000
sync-chunk-writes=true
region-file-compression=deflate
initial-enabled-packs=vanilla
initial-disabled-packs=

#--- Gameplay -----------------------------------------------------------
gamemode=survival
force-gamemode=false
difficulty=normal
hardcore=false
enable-command-block=false
allow-nether=true
max-tick-time=60000
pause-when-empty-seconds=60

#--- Performance (vanilla level; most of the real tuning is in the
#--- generated config\paper-global.yml and config\paper-world-defaults.yml)
view-distance=10
simulation-distance=8
entity-broadcast-range-percentage=100
enable-jmx-monitoring=false

#--- Resources ----------------------------------------------------------
require-resource-pack=false
resource-pack=
resource-pack-id=
resource-pack-prompt=
resource-pack-sha1=
text-filtering-config=
text-filtering-version=0
bug-report-link=
enable-code-of-conduct=false
chat-spam-threshold-seconds=10
command-spam-threshold-seconds=10
hide-online-players=false
status-heartbeat-interval=0
